# Reusable workflow for building the native shim for both regular builds and version publish
name: Build IREE Native Shim

on:
  workflow_call:
    outputs:
      artifact-pattern:
        description: "Pattern matching the artifact name for the built shim"
        value: iree-libs-*

jobs:
  build-iree-shim:
    strategy:
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-latest
          - platform: linux-aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - name: Checkout djl-iree-engine repository
        uses: actions/checkout@v7

      # Provenance gate: prove the pinned runtime tarball was built by Repo A's CI before we link
      # against it. URL_HASH in native/CMakeLists.txt covers integrity; this covers provenance.
      - name: Verify IREE runtime provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url="$(grep -oE 'https://[^"]*default-${{ matrix.platform }}\.tar\.gz' native/cmake/IreeRuntimePin.cmake | head -1)"
          test -n "${url}" || { echo "no default URL in IreeRuntimePin.cmake"; exit 1; }
          curl -fL -o runtime.tgz "${url}"
          gh attestation verify runtime.tgz --repo measly-java-learning/iree-runtime-dist
          rm -f runtime.tgz

      # The toolchain image: manylinux_2_28 at a dated tag plus the JNI headers, ninja, and ASan
      # runtime the base does not ship, all at pinned versions. Built here rather than pulled from
      # a registry -- warm-build-image.yml keeps the layers in the GHA cache, so this is a cache
      # hit rather than a dnf round-trip. `load: true` puts the image in the local daemon for the
      # docker run steps below.
      - uses: docker/setup-buildx-action@v4.2.0
      - name: Build the pinned toolchain image
        uses: docker/build-push-action@v7.3.0
        with:
          context: docker
          file: "docker/${{ matrix.platform }}.Dockerfile"
          tags: djl-iree-engine-build:${{ matrix.platform }}
          load: true
          cache-from: type=gha,scope=${{ matrix.platform }}

      # This is very similar to how `local_build_wrapper.sh` executes build
      # which enables testing outside of GHA
      - name: Build the libiree_djl shim
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            djl-iree-engine-build:${{ matrix.platform }} \
            /bin/bash /workspace/native/build.sh

      - name: Run native QA gate (Catch2 units + ASan/LSan leak harness)
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            djl-iree-engine-build:${{ matrix.platform }} \
            /bin/bash /workspace/native/build_qa.sh

      # Gate B, phase 1: build the instrumented shim with the pinned toolchain and libubsan
      # NEVRA. The JVM phase runs in build-java-package, which has a JDK 17 -- this
      # container's JAVA_HOME is Corretto 8, so Gradle cannot start here at all.
      #
      # Scoped to linux-x86_64: a second native build plus a --rerun-tasks JVM suite is real
      # CI time, and aarch64 gets documented gaps rather than duplicated gates.
      - name: Build the UBSan-instrumented shim (linux-x86_64 only)
        if: matrix.platform == 'linux-x86_64'
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            djl-iree-engine-build:${{ matrix.platform }} \
            /bin/bash /workspace/native/ubsan_gate.sh

      # A DISTINCT artifact name, deliberately outside the `iree-libs-*` pattern that
      # build-java-package merges into src/main/resources/native/. An instrumented library
      # landing there would be staged into the shipping resources -- the exact trip-wire
      # this design exists to avoid -- and would silently become what `./gradlew test` loads.
      - name: Store the UBSan shim
        if: matrix.platform == 'linux-x86_64'
        uses: actions/upload-artifact@v7
        with:
          name: iree-ubsan-shim-${{ matrix.platform }}
          path: native/ubsan/libiree_djl.so

      - name: Store libiree_djl shim
        id: shim-upload-step
        uses: actions/upload-artifact@v7
        with:
          name: iree-libs-${{ matrix.platform }}
          path: |
            ${{ github.workspace }}/src/main/resources/native/**/*.so
            ${{ github.workspace }}/src/main/resources/native/**/licenses/**
          compression-level: 1 # May want to consider no compression

  # Windows amd64: a sibling job rather than a matrix row, because the linux rows are
  # container-based (manylinux bakes the glibc floor into the image) and Windows has no
  # container. Both jobs upload under the iree-libs-* pattern, so publish.yml and
  # native-build.yml consume them unchanged. A future macOS platform follows this shape.
  build-iree-shim-windows:
    runs-on: windows-2022
    permissions:
      contents: read
    steps:
      - name: Checkout djl-iree-engine repository
        uses: actions/checkout@v7

      # Provenance gate: prove the pinned runtime tarball was built by Repo A's CI before we
      # link against it. URL_HASH in native/CMakeLists.txt covers integrity; this covers
      # provenance. IreeRuntimePin.cmake has exactly ONE Windows row, so the plain pattern
      # needs no -static disambiguation (unlike ExecuTorch's pin file).
      - name: Verify IREE runtime provenance
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url="$(grep -oE 'https://[^"]*default-windows-x86_64\.tar\.gz' native/cmake/IreeRuntimePin.cmake | head -1)"
          test -n "${url}" || { echo "no default URL in IreeRuntimePin.cmake"; exit 1; }
          curl -fL -o runtime.tgz "${url}"
          gh attestation verify runtime.tgz --repo measly-java-learning/iree-runtime-dist
          rm -f runtime.tgz

      # Resolve the VS install ONCE and publish it to $GITHUB_ENV for the steps below.
      # Discovery is edition-agnostic (-products *) so a runner-image edition change does
      # not silently break the build. Add-Content, NOT `Out-File -Encoding utf8`: under
      # Windows PowerShell 5.1 that writes a UTF-8 BOM, and a BOM in GITHUB_ENV makes the
      # runner parse the name as "<BOM>VS_PATH", so $env:VS_PATH is empty in every later
      # step. Only DISCOVERY is hoisted, not ACTIVATION: Launch-VsDevShell mutates the
      # current process env, and each step runs in a fresh process, so every step that
      # needs `cl` must still activate.
      - name: Discover Visual Studio
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -products * -property installationPath
          if (-not $vsPath) { throw "vswhere found no Visual Studio installation" }
          Add-Content -Path $env:GITHUB_ENV -Value "VS_PATH=$vsPath"
          echo "Visual Studio: $vsPath"

      - name: Build the iree_djl shim (MSVC)
        shell: pwsh
        run: |
          if (-not $env:VS_PATH) { throw "VS_PATH unset — the 'Discover Visual Studio' step must run first" }
          & "$env:VS_PATH\Common7\Tools\Launch-VsDevShell.ps1" -Arch amd64 -SkipAutomaticLocation
          # Bind JAVA_HOME explicitly to the image's JDK 8 (JAVA_HOME_8_X64): the default
          # JAVA_HOME is an image property GitHub can change, and we want the oldest
          # supported jni.h for the widest runtime compatibility — matching the Linux rows'
          # Corretto 8 RPM. We compile against jni.h only and never link libjvm.
          if (-not $env:JAVA_HOME_8_X64) { throw "JAVA_HOME_8_X64 not set on this runner image" }
          $env:JAVA_HOME = $env:JAVA_HOME_8_X64
          # Invoke Git-Bash by explicit path so PATH order cannot select WSL's
          # System32\bash.exe, which would run the build in a Linux environment with no MSVC
          # toolchain. Non-login (`-c`, not `-lc`): a login shell re-sources the profile and
          # resets PATH, dropping the VS env.
          $bash = "${env:ProgramFiles}\Git\bin\bash.exe"
          & $bash -c './native/build.sh'
          if ($LASTEXITCODE -ne 0) { throw "shim build failed (exit $LASTEXITCODE)" }

      - name: QA the iree_djl shim (MSVC)
        shell: pwsh
        run: |
          if (-not $env:VS_PATH) { throw "VS_PATH unset — the 'Discover Visual Studio' step must run first" }
          & "$env:VS_PATH\Common7\Tools\Launch-VsDevShell.ps1" -Arch amd64 -SkipAutomaticLocation
          $bash = "${env:ProgramFiles}\Git\bin\bash.exe"
          & $bash -c './native/build_qa.sh'
          if ($LASTEXITCODE -ne 0) { throw "shim QA failed (exit $LASTEXITCODE)" }

      # Stands in for the clean-image redist test, which we have no machine to run: asserts
      # the CRT directives across the shim tree and that the DLL imports no VCRUNTIME/MSVCP.
      # Runs before the upload so a dynamically-linked DLL is never published as an artifact.
      - name: Assert the shim links the static CRT (MSVC)
        shell: pwsh
        run: |
          if (-not $env:VS_PATH) { throw "VS_PATH unset — the 'Discover Visual Studio' step must run first" }
          & "$env:VS_PATH\Common7\Tools\Launch-VsDevShell.ps1" -Arch amd64 -SkipAutomaticLocation
          $bash = "${env:ProgramFiles}\Git\bin\bash.exe"
          & $bash -c './native/tests/check_windows_crt.sh native/build src/main/resources/native/windows-x86_64/iree_djl.dll'
          if ($LASTEXITCODE -ne 0) { throw "windows CRT check failed (exit $LASTEXITCODE)" }

      - name: Store iree_djl shim
        uses: actions/upload-artifact@v7
        with:
          name: iree-libs-windows-x86_64
          path: |
            ${{ github.workspace }}/src/main/resources/native/**/*.dll
            ${{ github.workspace }}/src/main/resources/native/**/licenses/**
          compression-level: 1
