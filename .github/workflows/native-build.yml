name: IREE Engine Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-iree-shim:
    uses: ./.github/workflows/native-build-job.yml
    permissions:
      contents: read
 
  # setup-java action repo: https://github.com/actions/setup-java
  build-java-package:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      code-quality: write
      pull-requests: read
    needs: build-iree-shim
    steps:
        - uses: actions/checkout@v7

        # Fixture portability: every committed .vmfb must carry cpu = "generic" and an
        # OS-agnostic embedded-ELF triple, so it runs on any CPU of its architecture and
        # any OS. Pure file inspection — no toolchain needed, so it sits in the Java job
        # rather than the native matrix. Runs before anything expensive: a bad fixture
        # should fail in seconds, not after a full container build.
        - name: Check fixture portability
          run: bash tools/check_fixture_portability.sh

        - uses: actions/setup-java@v5.6.0
          with:
            distribution: zulu
            java-version: 17
        
          # Because the artifact isn't the full `src/main/resources/native`
          # we need to give `download-artifact` a target path
        - name: Download the libiree_djl shim
          uses: actions/download-artifact@v8
          with:
            pattern: iree-libs-*
            path: src/main/resources/native/
            merge-multiple: true
        
        # Debug print
        - run: tree -h src/main/resources/native

        # Download the iree-runtime-dist metadata zip (tag+repo derived from
        # native/cmake/IreeRuntimePin.cmake; gh auto-auths via GITHUB_TOKEN).
        - name: Fetch iree-runtime-dist metadata
          run: bash tools/fetch-iree-metadata.sh

        # https://github.com/gradle/actions
        # This has enhanced caching 
        - name: Setup Gradle
          uses: gradle/actions/setup-gradle@v6
        - name: Build and test the Java package
          run: |
              ./gradlew build
              ./gradlew test
              ./gradlew leakTest

