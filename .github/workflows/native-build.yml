name: IREE Engine Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-iree-shim:
    uses: ./.github/workflows/native-build-job.yml
    permissions:
      contents: read
 
  # setup-java action repo: https://github.com/actions/setup-java
  build-java-package:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      code-quality: write
      pull-requests: read
    needs: build-iree-shim
    steps:
        - uses: actions/checkout@v7

        # Fixture portability: every committed .vmfb must carry cpu = "generic" and an
        # OS-agnostic embedded-ELF triple, so it runs on any CPU of its architecture and
        # any OS. Pure file inspection — no toolchain needed, so it sits in the Java job
        # rather than the native matrix (kept out of native-build-job.yml to avoid
        # conflicting with planned Windows amd64 work there). It still waits on
        # build-iree-shim's full container matrix via `needs`, but within this job it
        # runs before every other step: a bad fixture fails in seconds, not after the
        # rest of build-java-package's work.
        - name: Check fixture portability
          run: bash tools/check_fixture_portability.sh

        - uses: actions/setup-java@v5.6.0
          with:
            distribution: zulu
            java-version: 17
        
          # Because the artifact isn't the full `src/main/resources/native`
          # we need to give `download-artifact` a target path
        - name: Download the libiree_djl shim
          uses: actions/download-artifact@v8
          with:
            pattern: iree-libs-*
            path: src/main/resources/native/
            merge-multiple: true
        
        # Debug print
        - run: tree -h src/main/resources/native

        # Download the iree-runtime-dist metadata zip (tag+repo derived from
        # native/cmake/IreeRuntimePin.cmake; gh auto-auths via GITHUB_TOKEN).
        - name: Fetch iree-runtime-dist metadata
          run: bash tools/fetch-iree-metadata.sh

        # https://github.com/gradle/actions
        # This has enhanced caching 
        - name: Setup Gradle
          uses: gradle/actions/setup-gradle@v6
        - name: Build and test the Java package
          run: |
              ./gradlew build
              ./gradlew test
              ./gradlew leakTest

        # Gate B, phase 2: the JVM suite against the UBSan-instrumented shim built by
        # build-iree-shim. This job is where a JDK 17 exists; the container that produced the
        # library cannot run Gradle at all.
        #
        # Downloaded OUTSIDE src/main/resources/native/ and reached via IREE_LIBRARY_PATH,
        # which LibUtils honours ahead of the classpath copy. The instrumented library is
        # never staged into resources.
        #
        # TEST_TASKS omits oomTest and stressTest: oomTest needs the pinned pip iree-compile
        # for its exportOomFixture dependency, which this job does not carry, so the issue 16
        # reproduction stays a local gate by decision, not by oversight. See
        # docs/superpowers/specs/2026-08-12-ubsan-and-jni-checking-design.md.
        - name: Download the UBSan-instrumented shim
          uses: actions/download-artifact@v8
          with:
            name: iree-ubsan-shim-linux-x86_64
            path: native/ubsan/

        - name: UBSan gate over the JNI shim
          env:
            IREE_DJL_UBSAN_MODE: test
            TEST_TASKS: "test leakTest"
          run: ./native/ubsan_gate.sh

