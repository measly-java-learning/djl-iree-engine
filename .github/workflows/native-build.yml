name: IREE Engine Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-iree-shim:
    uses: $/.github/workflows/native-build-job.yml
    permissions:
      contents: read
 
  lockfile:
    # Fails when actions.lock is out of sync with the workflows, or when a
    # locked commit no longer verifies upstream. Run `gh actions-lock` to fix.
    runs-on: ubuntu-slim
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: gh extension install github/gh-actions-lock --pin v0.4.1
      - run: gh actions-lock --verify

  # setup-java action repo: https://github.com/actions/setup-java
  build-java-package:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      code-quality: write
      pull-requests: read
    needs: build-iree-shim
    steps:
        - uses: actions/checkout@v7.0.1

        # Fixture portability: every committed .vmfb must carry cpu = "generic" and an
        # OS-agnostic embedded-ELF triple, so it runs on any CPU of its architecture and
        # any OS. Pure file inspection — no toolchain needed, so it sits in the Java job
        # rather than the native matrix (kept out of native-build-job.yml to avoid
        # conflicting with planned Windows amd64 work there). It still waits on
        # build-iree-shim's full container matrix via `needs`, but within this job it
        # runs before every other step: a bad fixture fails in seconds, not after the
        # rest of build-java-package's work.
        - name: Check fixture portability
          run: bash tools/check_fixture_portability.sh

        - uses: actions/setup-java@v6.3.0
          with:
            distribution: zulu
            java-version: 17
        
          # Because the artifact isn't the full `src/main/resources/native`
          # we need to give `download-artifact` a target path
        - name: Download the libiree_djl shim
          uses: actions/download-artifact@v8.0.2
          with:
            pattern: iree-libs-*
            path: src/main/resources/native/
            merge-multiple: true
        
        # Debug print
        - run: tree -h src/main/resources/native

        # Download the iree-runtime-dist metadata zip (tag+repo derived from
        # native/cmake/IreeRuntimePin.cmake; gh auto-auths via GITHUB_TOKEN).
        - name: Fetch iree-runtime-dist metadata
          run: bash tools/fetch-iree-metadata.sh

        # https://github.com/gradle/actions
        # This has enhanced caching 
        - name: Setup Gradle
          uses: gradle/actions/setup-gradle@v6.4.1
        - name: Build and test the Java package
          run: |
              ./gradlew build
              ./gradlew test
              ./gradlew leakTest

        # Gate B, phase 2: the JVM suite against the UBSan-instrumented shim built by
        # build-iree-shim. This job is where a JDK 17 exists; the container that produced the
        # library cannot run Gradle at all.
        #
        # Downloaded OUTSIDE src/main/resources/native/ and reached via IREE_LIBRARY_PATH,
        # which LibUtils honours ahead of the classpath copy. The instrumented library is
        # never staged into resources.
        #
        # TEST_TASKS omits oomTest and stressTest: oomTest needs the pinned pip iree-compile
        # for its exportOomFixture dependency, which this job does not carry, so the issue 16
        # reproduction stays a local gate by decision, not by oversight. See
        # docs/superpowers/specs/2026-08-12-ubsan-and-jni-checking-design.md.
        - name: Download the UBSan-instrumented shim
          uses: actions/download-artifact@v8.0.2
          with:
            name: iree-ubsan-shim-linux-x86_64
            path: native/ubsan/

        - name: UBSan gate over the JNI shim
          env:
            IREE_DJL_UBSAN_MODE: test
            TEST_TASKS: "test leakTest"
          run: ./native/ubsan_gate.sh


  # Java (JaCoCo) and C++ (gcov, via gcovr) coverage, uploaded to Codecov under the `java`
  # and `cpp` flags. One job measures both, because one JVM run drives both: the JVM suite
  # exercises the Java code AND the coverage-instrumented JNI shim it loads through
  # IREE_LIBRARY_PATH. See native/coverage.sh for the two phases.
  #
  # linux-x86_64 only, like the UBSan gate: the code under measurement is the same on every
  # platform, and a second instrumented build per arch would buy CI time, not lines.
  #
  # Independent of build-iree-shim: it builds its own instrumented tree and never touches
  # the shipping artifacts, so it runs alongside the matrix instead of after it.
  coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Resolve the pinned toolchain image
        run: echo "ENGINE_BUILD_IMAGE=$(cat .engine-build-image)" >> "$GITHUB_ENV"

      # Mounted at the workspace's own path, NOT /workspace: gcc bakes absolute object paths
      # into the instrumented .so, and the host-side JVM run below must write its .gcda files
      # to the same place. HOST_UID/HOST_GID let the script's exit trap hand native/coverage
      # back to the runner user, which the JVM phase then writes into.
      - name: Build the coverage shim and run the Catch2 suites
        run: |
          docker run --rm \
            -e HOST_UID="$(id -u)" \
            -e HOST_GID="$(id -g)" \
            -v "${GITHUB_WORKSPACE}:${GITHUB_WORKSPACE}" \
            -w "${GITHUB_WORKSPACE}" \
            "${ENGINE_BUILD_IMAGE}" \
            /bin/bash native/coverage.sh

      - uses: actions/setup-java@v6.3.0
        with:
          distribution: zulu
          java-version: 17

      - name: Fetch iree-runtime-dist metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tools/fetch-iree-metadata.sh

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.4.1

      # Pinned: the report format is gcovr's, so a floating version could change what
      # Codecov sees with no change here.
      - name: Install gcovr
        run: pipx install gcovr==8.4

      # coverage.sh checks for a gcov whose major version matches the container's gcc and
      # names the package to install when it is missing.
      - name: JVM suite against the coverage shim, then the gcovr report
        env:
          IREE_DJL_COVERAGE_MODE: test
        run: ./native/coverage.sh

      # disable_search + plugins: noop so each upload carries exactly the one report named,
      # and the uploader does not run its own gcov pass -- with the runner's default gcov,
      # which is the wrong major version for these .gcda files.
      - name: Upload Java coverage
        uses: codecov/codecov-action@v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: build/reports/jacoco/test/jacocoTestReport.xml
          flags: java
          disable_search: true
          plugins: noop
          fail_ci_if_error: true

      - name: Upload C++ coverage
        uses: codecov/codecov-action@v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: native/coverage/coverage.xml
          flags: cpp
          disable_search: true
          plugins: noop
          fail_ci_if_error: true
